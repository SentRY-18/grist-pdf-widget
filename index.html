<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; line-height: 1.4; }
    
    /* =========================================================
       INTERFACE UTILISATEUR
       ========================================================= */
    #ui-zone { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    h1 { color: #333; margin-bottom: 20px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 20px; }
    .label-with-info { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; color: #555; font-weight: 500; font-size: 14px; }
    .input-row { display: flex; gap: 15px; margin-bottom: 15px; }
    .input-col { flex: 1; }
    
    input[type="text"], input[type="number"] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; display: block; background: #fafafa; transition: all 0.2s; }
    input:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
    
    button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: 500; transition: background 0.2s; display: inline-flex; align-items: center; gap: 8px; width: 100%; justify-content: center; margin-top: 10px; }
    button:hover { background: #5568d3; }

    #status { margin-top: 15px; font-size: 13px; text-align: center; font-weight: 500; color: #666; }

    /* =========================================================
       ZONE DE RENDU INVISIBLE (POUR LE PDF)
       ========================================================= */
    #render-zone {
      position: absolute;
      top: 0;
      left: 0;
      z-index: -9999;
      opacity: 0.01; /* Presque invisible, mais suffisant pour que html2canvas puisse le lire */
      pointer-events: none;
      width: 210mm;
      background: white;
    }

    /* CSS OFFICIEL DU WIDGET MARKDOWN DE GRIST POUR UN RENDU IDENTIQUE */
    .editor-preview { font-family: sans-serif; line-height: 1.4; color: black; padding: 10mm 15mm; }
    .editor-preview code { background-color: #dfe9ff; padding: 0 4px; border-radius: 4px; color: black; }
    .editor-preview blockquote { border-left: 4px solid #ddd; margin: 0; padding: 0 1rem; color: #666; }
    .editor-preview pre { background-color: #eef3ff; padding: 8px; border-radius: 4px; }
    .editor-preview pre code { background-color: unset; padding: unset; border-radius: unset; }
    .editor-preview hr { margin-top: 2rem; margin-bottom: 2rem; }
    .editor-preview table { width: 100%; margin: 2rem 0; border-spacing: 0; border: 1px solid lightgrey; border-left: none; border-top: none; border-collapse: collapse; }
    .editor-preview table th, .editor-preview table td { border: 1px solid lightgrey; padding: 0.5rem 1rem; border-right: none; border-bottom: none; }
    .editor-preview table th:empty, .editor-preview table td:empty { height: 0px; padding: 0px; border-top: none; }
  </style>
</head>

<body>
  <div id="ui-zone">
    <h1>📦 Export PDF en Lot (ZIP)</h1>

    <div class="form-group">
      <div class="input-row">
        <div class="input-col">
          <label class="label-with-info">De la ligne N° :</label>
          <input type="number" id="startRow" value="1" min="1">
        </div>
        <div class="input-col">
          <label class="label-with-info">À la ligne N° :</label>
          <input type="number" id="endRow" value="5" min="1">
        </div>
      </div>

      <label class="label-with-info" for="namePattern">
        Nom des documents PDF :
      </label>
      <input type="text" id="namePattern" placeholder="Ex: PV_{Nom_Etablissement}">

      <button id="generateBtn">Générer le dossier ZIP</button>
      <div id="status">En attente du mapping de la colonne HTML à droite...</div>
    </div>
  </div>

  <div id="render-zone"></div>

  <script>
    grist.ready({ 
      requiredAccess: 'full',
      columns: [{ name: "col_html", title: "Colonne HTML", optional: false, type: "Text" }]
    });

    const generateBtn = document.querySelector("#generateBtn");
    const namePattern = document.querySelector("#namePattern");
    const statusDiv = document.querySelector("#status");
    
    let mappedData = [];
    let allDataRows = [];
    let htmlColumnName = null;

    // 1. Récupération des données
    grist.onRecords(async (records) => {
      mappedData = records;
      
      if (records.length > 0) {
        const keys = Object.keys(records[0]).filter(key => key !== 'id');
        if (keys.length > 0) {
          htmlColumnName = keys[0];
          statusDiv.innerText = "✅ Prêt à générer !";
          statusDiv.style.color = "#10b981";
        }
      }
      
      try {
        const table = await grist.getTable();
        const tableName = await table._platform.getTableId();
        const allData = await grist.docApi.fetchTable(tableName);
        
        allDataRows = [];
        const numRows = allData.id.length;
        const columnNames = Object.keys(allData);
        
        for (let i = 0; i < numRows; i++) {
          const row = {};
          columnNames.forEach(colName => {
            row[colName] = allData[colName][i];
          });
          allDataRows.push(row);
        }
      } catch (error) {
        console.error("Erreur de récupération :", error);
      }
    });

    // 2. Moteur de renommage dynamique
    function generateFileName(row, index) {
      const pattern = namePattern.value.trim();
      if (!pattern) return `Document_${index + 1}`;
      
      const variables = pattern.match(/\{([^}]+)\}/g);
      if (!variables) return `${pattern}_${index + 1}`;
      
      let fileName = pattern;
      for (let variable of variables) {
        const columnId = variable.slice(1, -1).trim();
        if (columnId in row) {
          const value = (row[columnId] || '').toString().trim();
          fileName = fileName.replace(variable, value);
        }
      }
      return fileName.replace(/[^a-z0-9À-ÿ- ]/gi, '_').replace(/\s+/g, ' ').trim();
    }

    // 3. Processus de génération (Sécurisé contre les plantages mémoire)
    generateBtn.addEventListener('click', async () => {
      if (!htmlColumnName || mappedData.length === 0 || allDataRows.length === 0) {
        alert("Configuration incomplète ou données manquantes.");
        return;
      }

      const start = parseInt(document.getElementById('startRow').value);
      const end = parseInt(document.getElementById('endRow').value);
      if (isNaN(start) || isNaN(end) || start > end) return;

      const rowsToProcess = mappedData.slice(start - 1, end);
      if (rowsToProcess.length === 0) {
        alert("Aucun document trouvé dans cette plage.");
        return;
      }

      const renderZone = document.getElementById('render-zone');
      const zip = new JSZip();
      let pdfsGenerated = 0;

      generateBtn.disabled = true;
      generateBtn.style.opacity = "0.7";

      for (let i = 0; i < rowsToProcess.length; i++) {
        try {
          const mappedRow = rowsToProcess[i];
          const fullRow = allDataRows.find(r => r.id === mappedRow.id);
          const htmlContent = mappedRow[htmlColumnName];
          
          // Si la cellule est vide, on la saute sans faire planter la boucle
          if (!htmlContent || !fullRow) continue;

          let cleanFileName = generateFileName(fullRow, i);
          const uniqueFileName = `PV_${cleanFileName}_ID${mappedRow.id}.pdf`;

          pdfsGenerated++;
          statusDiv.innerText = `⏳ Création PDF ${pdfsGenerated} / ${rowsToProcess.length} ...`;
          statusDiv.style.color = "#667eea";

          // On injecte le HTML dans la div invisible avec la classe du Markdown Grist
          renderZone.innerHTML = `<div class="editor-preview">${htmlContent}</div>`;

          // Attente du chargement des images (max 1.5 seconde)
          const images = renderZone.querySelectorAll('img');
          const imagePromises = Array.from(images).map(img => {
              return new Promise((resolve) => {
                  if (img.complete) return resolve();
                  img.onload = resolve;
                  img.onerror = resolve; 
                  setTimeout(resolve, 1500); 
              });
          });
          await Promise.all(imagePromises);
          
          // Laisser le temps au navigateur d'appliquer le CSS
          await new Promise(r => setTimeout(r, 200));

          // Capture PDF
          const opt = {
            margin:       0, // Les marges sont gérées par le padding de .editor-preview
            filename:     uniqueFileName,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak:    { mode: ['css', 'legacy'] }
          };

          const pdfBlob = await html2pdf().set(opt).from(renderZone.firstElementChild).output('blob');
          if (pdfBlob && pdfBlob.size > 0) {
            zip.file(uniqueFileName, pdfBlob);
          }
          
          // NETTOYAGE MÉMOIRE TRÈS IMPORTANT (Empêche le blocage à 2 fichiers)
          renderZone.innerHTML = '';
          await new Promise(r => setTimeout(r, 500)); 
          
        } catch (error) {
          console.error(`Erreur création PDF ligne ${i}:`, error);
        }
      }

      // Téléchargement du ZIP
      if (pdfsGenerated > 0) {
        statusDiv.innerText = "📦 Assemblage du ZIP...";
        const zipBlob = await zip.generateAsync({type:"blob"});
        saveAs(zipBlob, `Export_Documents_PDF.zip`);
        
        statusDiv.innerText = `🎉 Terminé ! (${pdfsGenerated} PDF générés)`;
        statusDiv.style.color = "#10b981";
      } else {
        statusDiv.innerText = "⚠️ Aucun HTML valide n'a été trouvé dans ces lignes.";
        statusDiv.style.color = "#ef4444";
      }
      
      generateBtn.disabled = false;
      generateBtn.style.opacity = "1";
    });
  </script>
</body>
</html>
