<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Export PDF en Lot</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #f0f2f7 !important;
      color: #1a1d27 !important;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px; line-height: 1.5;
    }
    #app { max-width: 560px; margin: 0 auto; padding: 16px 14px; }
    .card {
      background: #fff !important;
      border: 1px solid #e2e5ed; border-radius: 8px;
      padding: 18px 20px; box-shadow: 0 2px 10px rgba(0,0,0,.07);
    }
    #app, #app * { color: #1a1d27 !important; }

    .hdr { display:flex; align-items:center; gap:10px; padding-bottom:13px; border-bottom:1px solid #e2e5ed; margin-bottom:15px; }
    .hdr-icon { width:32px; height:32px; background:linear-gradient(135deg,#4f5de8,#7c86f7); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
    .hdr-t { font-size:14px; font-weight:700; }
    .hdr-s { font-size:11px; color:#6b7280 !important; }

    #col-status {
      display:flex; align-items:center; gap:6px;
      padding:7px 10px; border-radius:6px; font-size:12px; font-weight:600;
      background:#fffbeb; color:#b45309 !important; border:1px solid #fde68a;
      margin-bottom:14px;
    }
    #col-status.ready { background:#ecfdf5; color:#065f46 !important; border-color:#6ee7b7; }
    #col-status .dot  { width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0; }

    .sec { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#6b7280 !important; margin-bottom:8px; }
    .field { margin-bottom:10px; }
    .field label { display:block; font-weight:600; font-size:12px; margin-bottom:4px; }
    .field label span { font-weight:400; color:#6b7280 !important; }

    input[type="text"], input[type="number"] {
      display:block; width:100%; padding:8px 10px;
      border:1.5px solid #d1d5db; border-radius:6px;
      font-size:13px; font-family:inherit;
      background:#f9fafb !important;
      color:#111827 !important; -webkit-text-fill-color:#111827 !important;
    }
    input:focus { outline:none; border-color:#4f5de8; box-shadow:0 0 0 3px rgba(79,93,232,.13); background:#fff !important; }
    input::placeholder { color:#9ca3af !important; -webkit-text-fill-color:#9ca3af !important; }

    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .hint { font-size:11px; color:#6b7280 !important; margin-top:3px; }

    .callout {
      display:flex; gap:8px; padding:8px 10px;
      background:#eef2ff; border:1px solid #c7d2fe; border-radius:6px;
      font-size:11.5px; color:#3730a3 !important; line-height:1.5;
    }
    .callout code { background:#c7d2fe; padding:1px 4px; border-radius:3px; font-size:11px; color:#1e1b4b !important; -webkit-text-fill-color:#1e1b4b !important; }

    hr { border:none; border-top:1px solid #e5e7eb; margin:13px 0; }

    .btn-row { display:flex; gap:8px; margin-top:4px; }
    #genBtn, #cancelBtn {
      padding:11px 16px; border:none; border-radius:7px;
      font-size:13px; font-weight:700; font-family:inherit;
      cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
      transition:opacity .2s, box-shadow .2s;
    }
    #genBtn {
      flex:1;
      background:linear-gradient(135deg,#4f5de8,#6b78f0);
      color:#fff !important; -webkit-text-fill-color:#fff !important;
      box-shadow:0 4px 14px rgba(79,93,232,.32);
    }
    #genBtn:hover:not(:disabled) { opacity:.9; }
    #genBtn:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
    #cancelBtn {
      display:none; flex:0 0 auto;
      background:#fee2e2; color:#991b1b !important; -webkit-text-fill-color:#991b1b !important;
      border:1px solid #fca5a5;
    }
    #cancelBtn.visible { display:flex; }
    #cancelBtn:hover { background:#fecaca; }

    #prog-area { display:none; margin-top:13px; }
    #prog-area.on { display:block; }
    .pbar-wrap { height:5px; background:#e5e7eb; border-radius:99px; overflow:hidden; margin-bottom:6px; }
    .pbar-fill  { height:100%; background:linear-gradient(90deg,#4f5de8,#7c86f7); border-radius:99px; transition:width .3s; width:0%; }
    .pbar-info  { display:flex; justify-content:space-between; font-size:11.5px; }
    .pbar-lbl   { font-weight:600; }
    .pbar-cnt   { color:#6b7280 !important; }

    #result { display:none; padding:9px 12px; border-radius:6px; font-size:12.5px; font-weight:600; margin-top:11px; text-align:center; }
    #result.ok   { display:block; background:#ecfdf5; color:#065f46 !important; border:1px solid #6ee7b7; }
    #result.err  { display:block; background:#fef2f2; color:#991b1b !important; border:1px solid #fca5a5; }
    #result.warn { display:block; background:#fffbeb; color:#b45309 !important; border:1px solid #fde68a; }

    /* ── Zone de rendu hors-écran ── */
    #render-zone {
      position:fixed; top:0; left:-9999px;
      width:794px; background:#fff; color:#000;
      pointer-events:none; z-index:-1;
    }
    #render-zone .ep {
      font-family:sans-serif; font-size:13px; line-height:1.5;
      color:#000 !important; background:#fff !important;
      padding:28px 38px; width:794px;
    }
    #render-zone .ep * { color:inherit !important; background:inherit; }
    #render-zone .ep h1 { font-size:20px; margin:12px 0 6px; }
    #render-zone .ep h2 { font-size:16px; margin:10px 0 5px; }
    #render-zone .ep h3 { font-size:14px; margin:8px 0 4px; }
    #render-zone .ep p  { margin:5px 0; }
    #render-zone .ep ul, #render-zone .ep ol { margin:5px 0 5px 18px; }
    #render-zone .ep li { margin:2px 0; }
    #render-zone .ep code { background:#dfe9ff !important; padding:0 4px; border-radius:4px; font-size:.9em; }
    #render-zone .ep blockquote { border-left:4px solid #ddd; margin:0; padding:0 1rem; color:#555 !important; }
    #render-zone .ep pre { background:#eef3ff !important; padding:8px; border-radius:4px; }
    #render-zone .ep pre code { background:none !important; padding:0; }
    #render-zone .ep hr { margin:1rem 0; border:none; border-top:1px solid #ddd; }
    #render-zone .ep img { max-width:100%; height:auto; display:inline-block; }
    #render-zone .ep table { width:100%; margin:8px 0; border-collapse:collapse; border:1px solid #bbb; }
    #render-zone .ep table th,
    #render-zone .ep table td { border:1px solid #bbb; padding:5px 10px; text-align:left; vertical-align:top; color:#000 !important; }
    #render-zone .ep table th { background:#f0f2f7 !important; font-weight:700; }
    #render-zone .ep table th:empty,
    #render-zone .ep table td:empty { height:0; padding:0; }
  </style>
</head>
<body>
<div id="app">
  <div class="card">
    <div class="hdr">
      <div class="hdr-icon">📦</div>
      <div>
        <div class="hdr-t">Export PDF en Lot</div>
        <div class="hdr-s">HTML Grist → PDF individuels → ZIP</div>
      </div>
    </div>

    <div id="col-status" class="waiting">
      <span class="dot"></span>
      <span id="col-txt">En attente du mapping de la colonne HTML →</span>
    </div>

    <div class="sec">Plage de lignes</div>
    <div class="row2">
      <div class="field">
        <label>De la ligne N°</label>
        <input type="number" id="startRow" value="1" min="1">
      </div>
      <div class="field">
        <label>À la ligne N°</label>
        <input type="number" id="endRow" value="10" min="1">
      </div>
    </div>
    <div class="hint" id="row-hint">— chargement…</div>

    <hr>

    <div class="sec">Nom des fichiers PDF</div>
    <div class="field">
      <label>Modèle <span>(variables : {Nom_Colonne})</span></label>
      <input type="text" id="namePattern" value="{Modele}.{Nom_du_modele} - {N_Etablissement}">
    </div>
    <div class="callout">
      <span>💡</span>
      <span>Modifiez le modèle si besoin. Utilisez <code>{Nom_Colonne}</code> pour insérer une valeur Grist.</span>
    </div>

    <div class="btn-row">
      <button id="genBtn" disabled>
        <span id="btn-ico">⚡</span><span id="btn-lbl">Générer le ZIP</span>
      </button>
      <button id="cancelBtn" title="Annuler">✕ Annuler</button>
    </div>

    <div id="prog-area">
      <div class="pbar-wrap"><div class="pbar-fill" id="pbar"></div></div>
      <div class="pbar-info">
        <span class="pbar-lbl" id="prog-lbl">Initialisation…</span>
        <span class="pbar-cnt" id="prog-cnt">0 / 0</span>
      </div>
    </div>

    <div id="result"></div>
  </div>
</div>

<div id="render-zone"></div>

<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const rz = $('render-zone');

  let mappedRecords = [];
  let allTableRows  = [];
  let htmlColKey    = null;
  let cancelled     = false;
  let busy          = false;

  /* ════════════════════════════════════════════════
     GRIST
  ════════════════════════════════════════════════ */
  grist.ready({
    requiredAccess: 'full',
    columns: [{ name:'col_html', title:'Colonne HTML', optional:false, type:'Text' }]
  });

  grist.onRecords(async (records, mappings) => {
    mappedRecords = records || [];
    htmlColKey = (mappings && mappings.col_html)
      ? mappings.col_html
      : (records.length ? Object.keys(records[0]).filter(k => k !== 'id')[0] : null);
    updateStatus();
    $('row-hint').textContent = `— ${mappedRecords.length} ligne(s) disponible(s)`;
    $('endRow').value = mappedRecords.length || 10;
    await loadFullTable();
  });

  async function loadFullTable() {
    try {
      const tbl = await grist.getTable();
      let id;
      if (typeof tbl.getTableId === 'function') id = await tbl.getTableId();
      else if (tbl._platform?.getTableId)       id = await tbl._platform.getTableId();
      else { allTableRows = mappedRecords; return; }
      const raw  = await grist.docApi.fetchTable(id);
      const cols = Object.keys(raw);
      allTableRows = Array.from({ length: raw.id.length }, (_, i) => {
        const r = {}; cols.forEach(c => r[c] = raw[c][i]); return r;
      });
    } catch { allTableRows = mappedRecords; }
  }

  function updateStatus() {
    const el = $('col-status');
    if (htmlColKey && mappedRecords.length > 0) {
      el.className = 'ready';
      $('col-txt').textContent = `✓ "${htmlColKey}" — ${mappedRecords.length} ligne(s)`;
      $('genBtn').disabled = false;
    } else {
      el.className = 'waiting';
      $('col-txt').textContent = 'En attente du mapping de la colonne HTML →';
      $('genBtn').disabled = true;
    }
  }

  /* ════════════════════════════════════════════════
     IMAGES : résolution des pièces jointes Grist
     
     Les URLs des pièces jointes ressemblent à :
       /api/docs/DOCID/attachments/42/download
     
     On les récupère via grist.docApi si possible,
     sinon via fetch() avec credentials.
     Dans tous les cas on convertit en base64
     pour que html2canvas puisse les afficher.
  ════════════════════════════════════════════════ */
  async function resolveImages(container) {
    const imgs = Array.from(container.querySelectorAll('img'));
    await Promise.all(imgs.map(async img => {
      const src = img.getAttribute('src') || '';
      if (!src || src.startsWith('data:')) return; // déjà base64

      try {
        // Construire l'URL absolue
        const url = src.startsWith('http') ? src : (location.origin + src);
        
        // Tentative 1 : fetch avec credentials (fonctionne si même origine)
        let blob = null;
        try {
          const r = await fetch(url, {
            credentials: 'include',
            mode: 'cors',
            cache: 'force-cache'
          });
          if (r.ok) blob = await r.blob();
        } catch (_) {}

        // Tentative 2 : fetch sans CORS (same-origin uniquement)
        if (!blob) {
          try {
            const r = await fetch(url, { credentials: 'include', mode: 'no-cors' });
            // mode no-cors retourne une "opaque response", on ne peut pas lire le blob
            // donc cette tentative ne sert qu'à précharger le cache navigateur
          } catch (_) {}
        }

        if (blob) {
          img.src = await blobToBase64(blob);
        } else {
          // Dernier recours : laisser l'URL et activer allowTaint dans html2canvas
          console.warn('Image non convertie en base64, URL laissée:', src);
        }
      } catch (e) {
        console.warn('Erreur résolution image:', src, e.message);
      }
    }));
  }

  function blobToBase64(blob) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload  = () => res(fr.result);
      fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
  }

  function waitImages(el, ms = 4000) {
    const imgs = Array.from(el.querySelectorAll('img'));
    if (!imgs.length) return Promise.resolve();
    return Promise.all(imgs.map(img => new Promise(res => {
      if (img.complete && img.naturalWidth > 0) return res();
      img.onload = img.onerror = res;
      setTimeout(res, ms);
    })));
  }

  /* ════════════════════════════════════════════════
     MOTEUR PDF
     
     Correction du bug "même page répétée" :
     - On capture le CONTENU ENTIER en un seul canvas haute résolution
     - On découpe ensuite ce canvas en tranches A4 dans jsPDF
     - Pas de scrollY tronqué = pas de répétition
  ════════════════════════════════════════════════ */
  async function htmlToBlob(html) {
    const { jsPDF } = window.jspdf;

    // 1. Injection dans la zone de rendu
    rz.innerHTML = `<div class="ep">${html}</div>`;
    const ep = rz.firstElementChild;

    // 2. Résolution images
    await resolveImages(ep);
    await waitImages(ep, 4000);
    await sleep(300); // laisser le navigateur finir le layout

    // 3. Capture TOTALE du contenu (une seule fois, toute la hauteur)
    const canvas = await html2canvas(ep, {
      scale:           2,
      useCORS:         true,
      allowTaint:      true,   // nécessaire si certaines images ne sont pas convertibles
      logging:         false,
      scrollX:         0,
      scrollY:         0,
      windowWidth:     794,
      width:           794,
      height:          ep.scrollHeight,  // capture toute la hauteur réelle
      backgroundColor: '#ffffff'
    });

    // 4. Découpage en pages A4 dans jsPDF
    // A4 en mm : 210 x 297
    // canvas : 794*2 = 1588 px de large, hauteur variable
    const pdf       = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    const MM_W      = 210;
    const MM_H      = 297;
    const canvasW   = canvas.width;           // largeur totale du canvas
    // Hauteur en px d'une page A4 dans le canvas (ratio identique à la largeur)
    const pageH_px  = Math.round(canvas.width * (MM_H / MM_W));
    const totalH_px = canvas.height;
    const numPages  = Math.max(1, Math.ceil(totalH_px / pageH_px));

    // Canvas temporaire pour découper chaque page
    const pageCanvas = document.createElement('canvas');
    pageCanvas.width  = canvasW;
    pageCanvas.height = pageH_px;
    const ctx = pageCanvas.getContext('2d');

    for (let p = 0; p < numPages; p++) {
      if (p > 0) pdf.addPage();

      const srcY      = p * pageH_px;
      const sliceH    = Math.min(pageH_px, totalH_px - srcY); // dernière page peut être plus courte

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvasW, pageH_px);
      ctx.drawImage(
        canvas,
        0, srcY,       // source : position dans le grand canvas
        canvasW, sliceH,
        0, 0,          // destination : en haut du canvas de page
        canvasW, sliceH
      );

      const imgData = pageCanvas.toDataURL('image/jpeg', 0.92);
      // On ajoute uniquement la partie remplie (évite du blanc si dernière page courte)
      const mmSliceH = sliceH * (MM_H / pageH_px);
      pdf.addImage(imgData, 'JPEG', 0, 0, MM_W, mmSliceH, '', 'FAST');
    }

    // Nettoyage mémoire
    canvas.width = canvas.height = 1;
    pageCanvas.width = pageCanvas.height = 1;
    rz.innerHTML = '';

    return pdf.output('blob');
  }

  /* ════════════════════════════════════════════════
     RENOMMAGE
  ════════════════════════════════════════════════ */
  function buildName(row, idx) {
    const pat = $('namePattern').value.trim() || `Document_${idx + 1}`;
    return pat
      .replace(/\{([^}]+)\}/g, (m, k) => {
        const key = k.trim();
        return (key in row) ? String(row[key] ?? '').trim() : m;
      })
      .replace(/[<>:"/\\|?*]/g, '_')  // caractères interdits dans les noms de fichiers
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 200) || `Document_${idx + 1}`;
  }

  /* ════════════════════════════════════════════════
     HELPERS UI
  ════════════════════════════════════════════════ */
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function setProgress(cur, tot, lbl) {
    $('pbar').style.width     = tot > 0 ? Math.round(cur/tot*100)+'%' : '0%';
    $('prog-lbl').textContent = lbl;
    $('prog-cnt').textContent = `${cur} / ${tot}`;
  }

  function showResult(cls, msg) {
    const el = $('result');
    el.className = cls; el.textContent = msg; el.style.display = 'block';
  }

  /* ════════════════════════════════════════════════
     BOUTON ANNULER
  ════════════════════════════════════════════════ */
  $('cancelBtn').addEventListener('click', () => {
    if (!busy) return;
    cancelled = true;
    $('prog-lbl').textContent = 'Annulation…';
  });

  /* ════════════════════════════════════════════════
     GÉNÉRATION PRINCIPALE
  ════════════════════════════════════════════════ */
  $('genBtn').addEventListener('click', async () => {
    if (busy) return;
    $('result').style.display = 'none';

    const start = parseInt($('startRow').value);
    const end   = parseInt($('endRow').value);
    if (isNaN(start) || isNaN(end) || start < 1 || end < start)
      return showResult('err', '⚠️ Plage invalide.');

    const slice = mappedRecords.slice(start - 1, end);
    if (!slice.length) return showResult('warn', '⚠️ Aucun enregistrement dans cette plage.');
    if (!htmlColKey)   return showResult('err',  '⚠️ Aucune colonne HTML mappée.');

    busy = true; cancelled = false;
    $('genBtn').disabled = true;
    $('btn-lbl').textContent = 'Génération en cours…';
    $('btn-ico').textContent = '⏳';
    $('cancelBtn').className = 'visible';
    $('prog-area').className = 'on';
    setProgress(0, slice.length, 'Initialisation…');

    const zip  = new JSZip();
    const used = new Set();
    let ok = 0, skip = 0;

    for (let i = 0; i < slice.length; i++) {
      if (cancelled) {
        showResult('warn', `⚠️ Annulé après ${ok} PDF générés.`);
        break;
      }

      const mapped = slice[i];
      const html   = mapped[htmlColKey];
      if (!html || !html.trim()) {
        skip++;
        setProgress(i+1, slice.length, `Ligne ${start+i} ignorée (vide)`);
        continue;
      }

      const fullRow = allTableRows.find(r => r.id === mapped.id) || mapped;
      let name = buildName(fullRow, start + i - 1);
      let file = `${name}.pdf`;
      if (used.has(file)) file = `${name}_id${mapped.id}.pdf`;
      used.add(file);

      setProgress(i, slice.length, `Création : ${file}`);

      try {
        const blob = await htmlToBlob(html);
        if (blob && blob.size > 500) {
          zip.file(file, blob);
          ok++;
        } else {
          skip++;
          console.warn(`PDF trop petit ou vide — ligne ${start+i}`);
        }
      } catch (e) {
        skip++;
        console.error(`Erreur ligne ${start+i}:`, e);
      }

      setProgress(i+1, slice.length, `${ok} PDF créés…`);
      if (i < slice.length - 1) await sleep(400);
    }

    if (ok > 0 && !cancelled) {
      setProgress(slice.length, slice.length, 'Assemblage du ZIP…');
      const zb = await zip.generateAsync({
        type:'blob', compression:'DEFLATE', compressionOptions:{level:5}
      });
      const d  = new Date();
      const ds = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
      saveAs(zb, `Export_PDF_${ds}.zip`);
      setProgress(slice.length, slice.length, 'ZIP téléchargé ✓');
      showResult('ok', `🎉 ${ok} PDF générés${skip ? ` (${skip} ignorée(s))` : ''}`);
    } else if (!cancelled) {
      showResult('err', '❌ Aucun PDF valide généré. Vérifiez le contenu HTML.');
    }

    rz.innerHTML = '';
    busy = false; cancelled = false;
    $('genBtn').disabled = false;
    $('btn-lbl').textContent = 'Générer le ZIP';
    $('btn-ico').textContent = '⚡';
    $('cancelBtn').className = '';
  });

})();
</script>
</body>
</html>
