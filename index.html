<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
    
    /* Interface du widget */
    #ui-zone { padding: 25px; max-width: 400px; margin: 20px auto; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h3 { text-align: center; margin-top: 0; color: #0056b3; }
    .input-group { margin-bottom: 15px; }
    label { font-weight: bold; font-size: 13px; }
    input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; }
    button:hover { background: #004494; }
    #status { margin-top: 15px; font-size: 13px; text-align: center; font-weight: bold; }
    #mapping-warning { display: none; background: #fff3cd; color: #856404; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; border: 1px solid #ffeeba; }

    /* Indicateur de chargement plein écran */
    #fullscreen-loader { display: none; position: fixed; top: 10px; right: 10px; background: #0056b3; color: white; padding: 10px 20px; border-radius: 5px; z-index: 10000; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

    /* Zone de rendu (Visible uniquement pendant la génération) */
    #render-zone { display: none; width: 210mm; background: white; margin: 0; padding: 0; }
    
    /* Reprise des styles du Markdown Grist pour les tableaux */
    .editor-preview { font-family: sans-serif; line-height: 1.4; color: black; }
    .editor-preview table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .editor-preview table th, .editor-preview table td { border: 1px solid black; padding: 5px; }
  </style>
</head>
<body>

  <div id="ui-zone">
    <h3>🖨️ Générateur PDF (Lot ZIP)</h3>
    <div id="mapping-warning">⚠️ Configuration : associez les colonnes à droite.</div>
    
    <div class="input-group">
      <label>De la ligne N° (Position) :</label>
      <input type="number" id="start" value="1" min="1">
    </div>
    <div class="input-group">
      <label>À la ligne N° (Position) :</label>
      <input type="number" id="end" value="5" min="1">
    </div>
    
    <button id="generateBtn">Générer le dossier ZIP</button>
    <div id="status">En attente de Grist...</div>
  </div>

  <div id="fullscreen-loader">⏳ Génération en cours...</div>
  
  <div id="render-zone" class="editor-preview"></div>

  <script>
    let tableRecords = [];
    let tableMappings = null;

    grist.ready({
      columns: [
        { name: "htmlCol", type: "Text", title: "Colonne HTML (Publipostage)" },
        { name: "nameCol", type: "Text", title: "Nommage fichier (Ex: Etablissement)" }
      ],
      requiredAccess: 'full'
    });

    grist.onRecords(function(records, mappings) {
      tableRecords = records;
      tableMappings = mappings;

      if (!mappings || !mappings.htmlCol || !mappings.nameCol) {
        document.getElementById('mapping-warning').style.display = 'block';
        document.getElementById('status').innerText = "Configuration incomplète.";
      } else {
        document.getElementById('mapping-warning').style.display = 'none';
        document.getElementById('status').innerText = "Prêt à générer !";
      }
    });

    document.getElementById('generateBtn').addEventListener('click', async () => {
      if (!tableMappings || !tableMappings.htmlCol || !tableMappings.nameCol) return;
      
      const start = parseInt(document.getElementById('start').value);
      const end = parseInt(document.getElementById('end').value);
      if (isNaN(start) || isNaN(end) || start > end) return;

      const selectedRecords = tableRecords.slice(start - 1, end);
      if (selectedRecords.length === 0) return;

      const uiZone = document.getElementById('ui-zone');
      const renderZone = document.getElementById('render-zone');
      const loader = document.getElementById('fullscreen-loader');
      
      const zip = new JSZip();
      let pdfsGenerated = 0;

      // TECHNIQUE ANTI-BUG : On masque le widget et on affiche le document "en dur"
      uiZone.style.display = 'none';
      renderZone.style.display = 'block';
      loader.style.display = 'block';
      document.body.style.backgroundColor = 'white';

      for (let i = 0; i < selectedRecords.length; i++) {
        try {
          const rec = selectedRecords[i];
          const htmlContent = rec[tableMappings.htmlCol];
          let fileName = rec[tableMappings.nameCol] || `Document_Ligne_${rec.id}`;

          if (!htmlContent) continue;

          pdfsGenerated++;
          loader.innerText = `⏳ PDF ${pdfsGenerated} / ${selectedRecords.length} (${fileName})...`;

          // 1. On injecte le HTML
          renderZone.innerHTML = htmlContent;

          // 2. CORRECTION CRITIQUE : On bloque le défilement en haut à gauche.
          // C'est ce qui empêchait html2canvas de voir le bas de vos documents !
          window.scrollTo(0, 0);

          // 3. Attente SÉCURISÉE des images (Maximum 1.5 secondes par image)
          const images = renderZone.querySelectorAll('img');
          const imagePromises = Array.from(images).map(img => {
              return new Promise((resolve) => {
                  if (img.complete) return resolve();
                  img.onload = resolve;
                  img.onerror = resolve; 
                  setTimeout(resolve, 1500); // Ne bloque jamais plus de 1.5 sec
              });
          });
          await Promise.all(imagePromises);
          
          // Léger temps de pause pour que le navigateur dessine les tableaux
          await new Promise(r => setTimeout(r, 250));

          // 4. Nettoyage du nom de fichier (retrait des accents pour le ZIP)
          const cleanFileName = String(fileName).replace(/[^a-z0-9À-ÿ-]/gi, '_');
          const uniqueFileName = `PV_ID${rec.id}_${cleanFileName}.pdf`;

          // 5. Options du PDF corrigées
          const opt = {
            margin:       0,
            filename:     uniqueFileName,
            image:        { type: 'jpeg', quality: 1 },
            html2canvas:  { 
              scale: 2, 
              useCORS: true,
              scrollY: 0, 
              scrollX: 0
            },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak:    { mode: 'css' } // Force le respect de vos "page-break-before"
          };

          // 6. Génération et ajout direct dans le ZIP
          const pdfBlob = await html2pdf().set(opt).from(renderZone).output('blob');
          if (pdfBlob && pdfBlob.size > 0) {
            zip.file(uniqueFileName, pdfBlob);
          }
          
          renderZone.innerHTML = '';
        } catch (error) {
          console.error(`Erreur création PDF ligne ${i}:`, error);
        }
      }

      // TECHNIQUE ANTI-BUG : On restaure l'interface
      uiZone.style.display = 'block';
      renderZone.style.display = 'none';
      document.body.style.backgroundColor = '#f8f9fa';

      if (pdfsGenerated > 0) {
        loader.innerText = "📦 Compression du dossier ZIP...";
        
        // Téléchargement du ZIP final
        const zipBlob = await zip.generateAsync({type:"blob"});
        saveAs(zipBlob, `Export_PV_Etablissements.zip`);
        
        loader.style.display = 'none';
        document.getElementById('status').innerText = `🎉 Terminé ! (${pdfsGenerated} fichiers dans le ZIP)`;
        document.getElementById('status').style.color = "green";
      } else {
        loader.style.display = 'none';
        document.getElementById('status').innerText = "⚠️ Zéro PDF généré (HTML vide).";
      }
    });
  </script>
</body>
</html>
